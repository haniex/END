<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0c0a09"/><stop offset="100%" stop-color="#1c1917"/></linearGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d4a574"/><stop offset="100%" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<!-- sound waves / rings -->
<circle cx="600" cy="360" r="60" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.9"/>
<circle cx="600" cy="360" r="120" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.5"/>
<circle cx="600" cy="360" r="180" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
<circle cx="600" cy="360" r="240" fill="none" stroke="#d4a574" stroke-width="0.8" opacity="0.18"/>
<circle cx="600" cy="360" r="300" fill="none" stroke="#d4a574" stroke-width="0.5" opacity="0.1"/>
<circle cx="600" cy="360" r="40" fill="url(#core)" opacity="0.6"/>
<circle cx="600" cy="360" r="16" fill="#f5f2ed"/>
<!-- abstract bars like equalizer -->
<g fill="#d4a574" opacity="0.35">
<rect x="200" y="320" width="8" height="80" rx="4"/><rect x="220" y="300" width="8" height="120" rx="4"/>
<rect x="240" y="340" width="8" height="40" rx="4"/><rect x="960" y="310" width="8" height="100" rx="4"/>
<rect x="980" y="290" width="8" height="140" rx="4"/><rect x="1000" y="330" width="8" height="60" rx="4"/>
</g>
<text x="600" y="680" text-anchor="middle" fill="#d4a574" font-family="system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="6">ECHO SPHERE</text>
</svg>