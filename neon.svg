<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0c0a09"/><stop offset="100%" stop-color="#1a0a12"/></linearGradient>
<linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#292524"/><stop offset="50%" stop-color="#44403c"/><stop offset="100%" stop-color="#1c1917"/></linearGradient>
<linearGradient id="neonr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<!-- road -->
<rect y="520" width="1200" height="230" fill="#0a0908"/>
<line x1="0" y1="600" x2="1200" y2="600" stroke="#44403c" stroke-width="2" stroke-dasharray="40 30" opacity="0.5"/>
<!-- car body simplified side profile -->
<path d="M200 480 L280 400 L500 380 L750 390 L900 450 L920 500 L200 500 Z" fill="url(#body)"/>
<!-- windows -->
<path d="M320 410 L480 395 L480 450 L300 460 Z" fill="#22d3ee" opacity="0.25"/>
<path d="M520 392 L720 400 L700 455 L520 450 Z" fill="#22d3ee" opacity="0.2"/>
<!-- neon underglow -->
<ellipse cx="550" cy="510" rx="300" ry="20" fill="#f43f5e" opacity="0.35"/>
<path d="M220 500 L900 500" stroke="url(#neonr)" stroke-width="4" opacity="0.8"/>
<!-- wheels -->
<circle cx="340" cy="510" r="45" fill="#1c1917" stroke="#a8a29e" stroke-width="3"/>
<circle cx="780" cy="510" r="45" fill="#1c1917" stroke="#a8a29e" stroke-width="3"/>
<circle cx="340" cy="510" r="20" fill="#44403c"/>
<circle cx="780" cy="510" r="20" fill="#44403c"/>
<text x="600" y="680" text-anchor="middle" fill="#f43f5e" font-family="system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="6">NEON DRIFT</text>
</svg>