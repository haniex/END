<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="50%" stop-color="#475569"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
<linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<!-- grid floor -->
<g stroke="#334155" stroke-width="1" opacity="0.4">
<line x1="0" y1="550" x2="1200" y2="550"/><line x1="100" y1="580" x2="1100" y2="580"/><line x1="200" y1="610" x2="1000" y2="610"/>
</g>
<!-- stylized figure silhouette -->
<ellipse cx="600" cy="200" rx="55" ry="65" fill="url(#armor)"/>
<path d="M520 280 L480 480 L540 480 L560 340 L640 340 L660 480 L720 480 L680 280 Z" fill="url(#armor)"/>
<!-- neon lines -->
<path d="M560 300 L520 400" stroke="url(#neon)" stroke-width="3" fill="none"/>
<path d="M640 300 L680 400" stroke="url(#neon)" stroke-width="3" fill="none"/>
<circle cx="600" cy="195" r="8" fill="#22d3ee"/>
<text x="600" y="700" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="6">VERTEX</text>
</svg>