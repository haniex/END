<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0c0a09"/></linearGradient>
<linearGradient id="cloak" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
<radialGradient id="aura" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.4"/><stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<circle cx="600" cy="300" r="200" fill="url(#aura)"/>
<!-- figure -->
<ellipse cx="600" cy="220" rx="50" ry="60" fill="#e2e8f0" opacity="0.9"/>
<!-- cloak -->
<path d="M520 280 Q480 400 460 560 Q600 520 740 560 Q720 400 680 280 Q600 300 520 280" fill="url(#cloak)" opacity="0.85"/>
<!-- staff / energy -->
<line x1="750" y1="200" x2="780" y2="520" stroke="#c4b5fd" stroke-width="4"/>
<circle cx="750" cy="180" r="24" fill="#a78bfa" opacity="0.8"/>
<circle cx="750" cy="180" r="12" fill="#f5f3ff"/>
<!-- glow particles -->
<circle cx="500" cy="350" r="4" fill="#c4b5fd" opacity="0.6"/>
<circle cx="700" cy="400" r="3" fill="#a78bfa" opacity="0.5"/>
<circle cx="550" cy="450" r="5" fill="#ddd6fe" opacity="0.4"/>
<text x="600" y="700" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="4">AETHER GUARDIAN</text>
</svg>